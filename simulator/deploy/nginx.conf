# Страница симулятора и мост rosbridge за одним адресом (http). Для https с
# доменом - Caddyfile рядом (TLS сам) или свой TLS-прокси перед этим nginx:
# страница, открытая по https, обязана ходить на мост по wss (иначе браузер
# заблокирует смешанный контент), поэтому мост и страница - за одним хостом.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types application/javascript text/css application/json;
  gzip_min_length 1024;

  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
  }
  # rosbridge v2 (WebSocket). rosbridge слушает путь "/", поэтому префикс /ros
  # снимается (слэш в конце proxy_pass).
  location /ros {
    proxy_pass http://tram-live:9090/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
