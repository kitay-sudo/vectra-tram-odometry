# Лист параметров ВАГОНА для ноды tram_estimator (контракт ТЗ).
#
# ФАЙЛ СГЕНЕРИРОВАН tools/gen_params.py: значения Params, заменённые
# калибровкой по данным (config/tram_calibration.json, её делает
# analysis/calib_sheet.py). Правьте калибровку или Params и перезапускайте.

/tram_state_estimator:
  ros__parameters:
    wheel_timeout_s: 1.0    # с · нет показаний тележек дольше — разомкнутый режим
    handle_timeout_s: 0.5    # с · нет ручки дольше — параметры не адаптируются
    init_window_s: 3.0    # с · окно начальной выставки по GNSS от первой точки
    map_file: "config/track_map.npz"    # — · карта путей; пусто — без карты
    origin_lat: .nan    # ° · начало ENU; NaN — первая точка GNSS master
    origin_lon: .nan    # ° · начало ENU; NaN — первая точка GNSS master
    origin_alt: .nan    # м · начало ENU; NaN — первая точка GNSS master
    frame_id: "map"    # — · система координат положения
    child_frame_id: "base_link"    # — · система вагона

    # ---------- Механика ----------
    M_nom: 28000.0    # кг · паспорт · номинальная масса вагона, средняя загрузка
    r_nom: 0.35    # м · паспорт · радиус колеса при среднем износе
    n_axles: 2    # — · паспорт · число осей
    driven: [true, true]    # — · паспорт · моторные оси
    braked: [true, true]    # — · паспорт · оси с тормозом, участвующие в торможении
    v_max_line: 20.0    # м/с · паспорт · максимальная скорость на линии

    # ---------- Привод ----------
    F_notch: 36000.0    # Н · паспорт · тяга при полном отклонении ручки
    F_brake: 30000.0    # Н · паспорт · тормозная сила при полном отклонении
    v_base: 8.0    # м/с · паспорт · скорость начала ослабления поля
    v_ed_fade: 1.5    # м/с · паспорт · скорость затухания электродинамического тормоза
    brake_hold_frac: 1.0    # — · паспорт · доля тормозной силы, которую механический тормоз сохраняет ниже v_ed_fade: 1 — полное замещение, 0 — тормоз гаснет вместе с ЭД
    notch_tract: [0.066667, 0.133333, 0.2, 0.266667, 0.333333, 0.4, 0.466667, 0.533333, 0.6, 0.666667, 0.733333, 0.8, 0.866667, 0.933333, 1.0]    # — · паспорт · доля полной тяги на позициях тяги 1…N; число позиций = длина списка
    notch_brake: [0.066667, 0.133333, 0.2, 0.266667, 0.333333, 0.4, 0.466667, 0.533333, 0.6, 0.666667, 0.733333, 0.8, 0.866667, 0.933333, 1.0]    # — · паспорт · доля полной тормозной силы на позициях торможения 1…N; число позиций = длина списка
    acc_u: [-1.0, -0.933333, -0.866667, -0.8, -0.733333, -0.666667, -0.6, -0.533333, -0.466667, -0.4, -0.333333, -0.266667, -0.2, -0.133333, -0.066667, 0.0, 0.066667, 0.133333, 0.2, 0.266667, 0.333333, 0.4, 0.466667, 0.533333, 0.6, 0.666667, 0.733333, 0.8, 0.866667, 0.933333, 1.0]    # — · измерение · табличный привод: сетка нормированной команды u (позиция / число позиций); пусто — параметрическая модель F_notch/F_brake
    acc_v: [0.0, 1.0, 2.0, 3.0, 4.0, 6.0, 8.0, 10.0, 12.0, 14.0, 16.0]    # м/с · измерение · табличный привод: сетка скорости
    acc_table: [-1.0482, -0.2421, -0.0589, -0.9574, -0.6092, -1.1576, -1.1815, -1.3679, -1.3432, -1.2996, -1.2746, -0.9088, -1.3332, -0.9553, -1.388, -1.4986, -1.6549, -1.6547, -1.5282, -1.3587, -1.2812, -1.2495, -0.8084, -1.2859, -0.9911, -1.3768, -1.5153, -1.5341, -1.4821, -1.4298, -1.28, -1.2169, -1.1927, -0.8139, -1.2723, -1.0516, -1.2838, -1.1508, -1.3174, -1.2032, -1.2735, -1.0944, -1.1139, -1.1116, -0.7753, -1.2168, -1.0081, -1.2044, -1.0947, -1.2479, -1.1512, -1.1775, -1.0064, -1.0325, -1.0283, -0.7401, -1.1419, -0.9651, -1.1084, -1.0154, -1.2452, -1.116, -1.1333, -1.0811, -0.98, -0.9406, -0.7034, -1.043, -0.9619, -1.0813, -1.0181, -1.1224, -1.1452, -1.2124, -1.0059, -0.835, -0.8136, -0.609, -1.0144, -0.7105, -0.3002, -0.4971, -0.4452, -0.5916, -0.3845, -0.392, -0.4637, -0.6653, -0.6621, -0.8031, -0.8156, -0.8554, -0.7965, -0.8402, -0.8528, -0.8119, -0.9261, -0.7816, -0.7185, -0.596, -0.7318, -0.707, -0.7555, -0.6647, -0.7418, -0.7238, -0.7478, -0.7346, -0.7638, -0.7087, -0.472, -0.6515, -0.6639, -0.6955, -0.6375, -0.6779, -0.6851, -0.7079, -0.6931, -0.6824, -0.6432, -0.3881, -0.5745, -0.611, -0.6131, -0.5764, -0.6483, -0.6666, -0.6743, -0.6616, -0.6345, -0.5184, -0.3185, -0.5037, -0.5468, -0.5474, -0.5311, -0.6222, -0.6223, -0.6238, -0.5723, -0.5173, -0.3509, -0.3225, -0.4424, -0.4484, -0.4228, -0.4662, -0.3504, -0.3674, -0.4231, -0.5054, -0.3639, -0.1981, -0.1457, -0.2995, -0.2498, -0.2763, -0.2441, 0.0, -0.2586, -0.1357, -0.387, -0.2503, 0.0, 0.0352, -0.1655, -0.0589, -0.0981, -0.0162, 0.0524, -0.0297, -0.0056, -0.0215, -0.0185, 0.1471, 0.0352, 0.0655, 0.0581, 0.0048, 0.0466, 0.1413, 0.0438, 0.0477, -0.0069, 0.0289, 0.1592, 0.1657, 0.2993, 0.1466, 0.1445, 0.1871, 0.2157, 0.1425, 0.0939, 0.1234, 0.1095, 0.1471, 0.3154, 0.4621, 0.3103, 0.2673, 0.3037, 0.3471, 0.1864, 0.177, 0.135, 0.1574, 0.1918, 0.3693, 0.5945, 0.5083, 0.458, 0.4051, 0.4078, 0.3429, 0.0351, 0.1937, 0.1125, 0.2013, 0.3509, 0.7436, 0.6744, 0.5462, 0.5207, 0.4725, 0.3804, 0.2711, 0.2239, 0.1985, 0.2181, 0.3486, 0.8317, 0.7404, 0.5946, 0.591, 0.605, 0.4759, 0.4291, 0.241, 0.2009, 0.2343, 0.3772, 0.8675, 0.7994, 0.7415, 0.7697, 0.769, 0.5579, 0.4541, 0.3234, 0.3201, 0.2948, 0.5251, 0.8976, 0.927, 0.8452, 0.9183, 0.831, 0.6381, 0.4847, 0.361, 0.3264, 0.3304, 0.6793, 0.8341, 0.9408, 0.9205, 0.9646, 0.883, 0.6589, 0.5512, 0.4011, 0.3595, 0.3699, 0.7705, 0.7857, 0.8726, 0.9123, 0.9759, 0.8923, 0.7436, 0.6319, 0.4369, 0.4296, 0.4199, 0.8337, 0.8191, 0.7584, 0.8905, 0.9509, 0.8775, 0.7617, 0.6481, 0.5031, 0.4644, 0.4602, 0.8822, 0.885, 0.7583, 0.8336, 0.9392, 0.8609, 0.7847, 0.6572, 0.5485, 0.4683, 0.4962, 0.9061, 0.9328, 0.8336, 0.801, 0.9514, 0.8209, 0.7989, 0.7035, 0.5212, 0.6, 0.5602, 0.8979, 0.8978, 0.8723, 0.8107, 0.8877, 0.825, 0.7622, 0.7661, 0.5485, 0.62, 0.5844, 0.8897, 0.8815, 0.857, 0.8018, 0.8775, 0.7279, 0.7166, 0.6123, 0.5757, 0.5615, 0.573]    # м/с² · измерение · табличный привод: ускорение на ровном пути A(u, v) по строкам acc_u, len(acc_u)·len(acc_v) значений; строка u = 0 — выбег, то есть сопротивление движению
    tau_drive: 0.4    # с · измерение · постоянная времени привода
    delay_drive: 0.1    # с · измерение · чистое запаздывание привода
    T_dead: 0.05    # — · настройка · мёртвая зона по нормированному моменту
    t_confirm: 0.15    # с · настройка · время подтверждения режима движения

    # ---------- Сопротивление ----------
    res_A: 0.0    # Н · измерение · постоянная часть сопротивления
    res_B: 0.0    # Н·с/м · измерение · линейная часть сопротивления
    res_C: 0.0    # Н·с²/м² · измерение · квадратичная часть сопротивления

    # ---------- Сцепление ----------
    mu_nominal: 0.25    # — · паспорт · коэффициент сцепления сухого рельса
    mu_min: 0.02    # — · паспорт · худшее сцепление (листопадная плёнка, лёд)
    tau_sat: 0.3    # с · настройка · темп снижения сцепления при признаках срыва
    tau_rec: 30.0    # с · настройка · темп восстановления сцепления без признаков срыва
    c_creep: 0.02    # — · измерение · податливость по крипу: ξ = c · μ
    c_creep_drag: 0.002    # — · измерение · крип ненагруженной оси от сопротивления вращению
    sigma_creep: 0.004    # — · настройка · неопределённость самого коэффициента крипа

    # ---------- Пределы корпуса ----------
    a_max_acc: 1.5    # м/с² · паспорт · предельное ускорение корпуса
    a_max_brake: 3.0    # м/с² · паспорт · предельное замедление корпуса, с рельсовым тормозом
    theta_max: 0.06    # рад · паспорт · максимальный уклон линии
    d_extra: 0.3    # м/с² · настройка · запас возмущения на отклонение массы и ветер
    a_free_decel: 0.75    # м/с² · паспорт · предельное замедление БЕЗ команды тормоза: уклон и сопротивление
    lock_ratio: 0.7    # — · настройка · показание оси ниже этой доли прогноза при торможении = блокировка (плавное торможение, в том числе рельсовым, отстаёт на проценты)
    a_slip_margin: 1.0    # м/с² · настройка · запас над пределом ускорения до признания срыва

    # ---------- Датчики ----------
    meas_units: "km_h"    # — · паспорт · единицы показаний: rad_s, rpm, hz (об/с), pulses_s (импульсы/с, с ppr), m_s, km_h
    ppr: 200    # имп/об · паспорт · импульсов на оборот вала датчика (для pulses_s)
    meas_scale: 1.001324    # — · измерение · поправочный множитель показаний (износ бандажей, погрешность номинала); определяется по эталонной скорости
    sensor_ratio: 1.0    # — · паспорт · передаточное число от колеса к валу датчика: 1 — датчик на колесе; для m_s и km_h не применяется
    sensors_per_axle: 1    # — · паспорт · датчиков на ось: 2 — оба борта, 1 — один
    sensor_axles: [true, true]    # — · паспорт · оси с датчиками (при датчике на валу двигателя — только моторные)
    curve_ratio_max: 0.0    # — · паспорт · b/R_min: наибольшая относительная разница путей бортов на кривой; учитывается при одном датчике на ось
    sigma_meas: 0.05    # м/с · паспорт · шум измерения скорости оси, с учётом квантования энкодера и окна измерения
    stuck_n: 20    # отсчётов · настройка · неизменных отсчётов = подозрение на залипание датчика
    stuck_dv: 0.5    # м/с · настройка · залипание признаётся, только если остальные датчики за это время изменились больше этого: на постоянной скорости реальный энкодер может выдавать одинаковые отсчёты
    recover_tol: 0.5    # м/с · настройка · исключённый датчик возвращается, если расходится с остальными не больше recover_tol + recover_rel·v
    recover_rel: 0.1    # — · настройка · относительная часть допуска возврата датчика
    t_recover: 2.0    # с · настройка · сколько датчик должен согласоваться с остальными, чтобы вернуться в работу
    v_dead_ref: 2.0    # м/с · настройка · скорость остальных, выше которой нулевой датчик считается оборванным
    axle_dot_alpha: 0.2    # — · настройка · сглаживание производной скорости оси
    calib_gain: 0.01    # — · настройка · темп калибровки масштаба осей на выбеге
    calib_v_min: 2.0    # м/с · настройка · минимальная скорость калибровки масштаба
    scale_range: 0.1    # — · паспорт · допустимый разброс масштаба оси (износ бандажа)

    # ---------- Фильтр ----------
    gate_nis: 9.0    # — · настройка · порог нормированной невязки (9 = 3σ)
    sigma_rej_frac: 0.5    # — · настройка · доля предела ускорения в σ возмущения при отвержении всех измерений
    q_v: 0.05    # м/с² · настройка · шум процесса по скорости
    q_d: 0.02    # м/с²/√с · настройка · дрейф возмущения на выбеге
    q_k: 0.003    # 1/√с · настройка · дрейф масштаба привода под нагрузкой
    p0_s: 1.0    # м · настройка · начальная σ положения
    p0_v: 1.0    # м/с · настройка · начальная σ скорости
    p0_d: 0.3    # м/с² · настройка · начальная σ возмущения
    p0_k: 0.1    # — · настройка · начальная σ масштаба привода
    k_min: 0.4    # — · настройка · нижняя граница масштаба привода
    k_max: 1.6    # — · настройка · верхняя граница масштаба привода
    t_adapt: 3.0    # с · настройка · окно установившегося режима для адаптации масштаба привода
    sigma_k_meas: 0.05    # — · настройка · σ оконного измерения масштаба привода
    adapt_f_min: 0.3    # — · настройка · минимальная средняя нагрузка привода в окне, доля номинала
    t_sat_hold: 3.0    # с · настройка · после признака срыва отвержение измерений считается объяснённым срывом
    v_adapt_min: 2.0    # м/с · настройка · ниже этой скорости параметры не адаптируются (квантование энкодера у нуля)
    t_valid: 1.0    # с · настройка · без принятых измерений дольше — оценка недостоверна
    agree_tol: 0.3    # м/с · настройка · оси согласны, если их показания расходятся не больше этого; согласие всех осей перевешивает модель
    agree_age: 0.3    # с · настройка · показание другой оси годится для проверки согласия, если оно не старше этого

    # ---------- Стоянка ----------
    v_standstill: 0.3    # м/с · настройка · полоса неразличимости стоянки
    t_standstill: 0.3    # с · настройка · время подтверждения стоянки

    # ---------- Служебное ----------
    dt: 0.05    # с · требование · шаг фильтра; в ноде задаётся частотой цикла rate_hz
