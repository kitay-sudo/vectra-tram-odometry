# Лист параметров ВАГОНА — ЛИСТ ОЦЕНКИ: калибровка только по split train
# (tools/split.json). По нему считаются все наши числа на holdout_scored.
# Карта здесь пустая: инструмент оценки подаёт карту, собранную только из
# обучающих прогонов (config/eval/track_map.npz, analysis/build_map.py eval).
# Жюри этот лист НЕ отдаётся.
#
# ФАЙЛ СГЕНЕРИРОВАН tools/gen_params.py: значения Params, заменённые
# калибровкой по данным (config/eval/tram_calibration.json; её делают analysis/calib_*.py).
# Правьте калибровку или Params и перезапускайте; руками не править.

/tram_state_estimator:
  ros__parameters:
    wheel_timeout_s: 1.0    # с · нет показаний тележек дольше — разомкнутый режим
    handle_timeout_s: 0.5    # с · нет ручки дольше — параметры не адаптируются
    init_window_s: 3.0    # с · окно начальной выставки по GNSS от первой точки
    map_file: ""    # — · карта путей; пусто — без карты
    projection: "mgrs"    # — · система выхода /result/position: mgrs (плоские MGRS, WGS84; так считает судья по ответу организаторов 25.09) | utm (абсолютные UTM E/N) | enu (касательная плоскость от первой точки master) | equirect (прежняя); z — высота (NavSatFix) точки выхода
    mgrs_grid: "37UCB"    # — · код квадрата — координаты непрерывно от его юго-западного угла; "37UCB" — как в карте организаторов pathgraph (x = E − 300 000, y = N − 6 100 000, через границу E = 400 км без скачка, x 99 156…103 347). Пусто — каждая точка в своём 100-км квадрате (Autoware; на границе скачок на 100 км)
    utm_zone: 0    # — · зона UTM; 0 — по точке выставки (здесь 37)
    mgrs_guard_m: 0.0    # м · только при mgrs_grid "": ближе к краю 100-км квадрата положение не публикуется; 0 — выкл. При фиксированном квадрате (по умолчанию) не действует: положение публикуется на каждом шаге после выставки
    output_point: "base_link"    # — · точка вагона на выходе: base_link — ось поворота передней тележки на уровне рельса (эталон судьи и pathgraph, tf организаторов 25.09) | master — антенна master (как до 26.09; вдоль пути на 9,87 м позади и на 3 м выше)
    antenna_master_x: -9.873    # м · антенна master в base_link, x (вперёд); y = 0
    antenna_rover_x: 2.563    # м · антенна rover в base_link, x (вперёд); y = 0
    antenna_z: 3.0    # м · высота обеих антенн над base_link (уровень рельса)
    scale_adapt: true    # — · онлайн-подстройка масштаба пути по привязкам к остановкам (±1 %)
    vehicle: "30618"    # — · вагон (docs/VEHICLES.md): 30618 (по умолчанию: организаторы проверяют только 30618) | 30639 — meas_scale этого вагона из vehicle_meas_scale; auto — общий лист (оба вагона); онлайн-масштабы по остановкам (scale_adapt, wheel_scale_online) работают при любом значении; незнакомое значение — auto с предупреждением в логе
    vehicle_ids: ["30618", "30639"]    # — · вагоны со своей калибровкой, в порядке vehicle_meas_scale
    vehicle_meas_scale: [1.001408, 1.000367]    # — · масштаб колёс каждого вагона (GNSS / тележки на установившемся ходу, записи вагона из тех же данных, что лист); заменяет meas_scale, если vehicle — из vehicle_ids
    wheel_scale_online: true    # — · онлайн-масштаб колёс по привязкам к остановкам: скорость × «путь по карте / путь колёс» на отрезках между остановками (не короче 300 м, не меньше двух), если он отходит от 1 больше чем на 0,5 % (не больше ±2 %); для смены масштаба колёс по датам (docs/VEHICLES.md §6)
    nomap_mode: "hold"    # — · без карты (map_file пуст): hold — стоять в якоре выставки (выбрано на train), line — по прямой вдоль курса выставки
    keep_offset_xy: true    # — · сдвиг «GNSS окна − карта» по горизонтали, если его разрешает keep_offset_max_status
    keep_offset_z: true    # — · то же по высоте (не больше 30 м)
    keep_offset_max_status: -1    # — · сдвиг сохраняется, если медиана NavSatFix.status окна не больше этого: −1 — никогда (на train выигрыша нет), 1 — только без RTK, 2 — всегда
    terminal_hold: "terminals"    # — · тупик карты: terminals — держать курсор только у известных конечных (≥3 обучающих прогона), off — ехать прямо, any — держать везде
    gnss_correction: true    # — · точки GNSS после окна выставки поправляют положение вдоль пути и ветку карты (с отбраковкой выбросов); false — GNSS только для выставки, как до 26.09
    gnss_sigma_rtk_m: 0.5    # м · σ точки GNSS при NavSatFix.status 2 (RTK)
    gnss_sigma_sbas_m: 1.5    # м · σ точки при status 1
    gnss_sigma_fix_m: 5.0    # м · σ точки при status 0 (без поправок: смещение до ~16 м)
    gnss_gate: 3.0    # σ · ворота невязки; дальше — только после подтверждения
    gnss_jump_m: 3.0    # м · поправка больше — только после подтверждения несколькими эпохами
    gnss_confirm_n: 3    # — · эпох RTK подряд, согласных между собой, для большой поправки (без RTK больших поправок нет)
    gnss_min_interval_s: 1.0    # с · поправки по RTK не чаще (без RTK — раз в 20 с)
    gnss_max_skew_s: 0.3    # с · метка GNSS не дальше этого от метки последнего входа на момент прихода (иначе часы GNSS сбиты: в данных — участки по минутам со сдвигом ±1 с)
    gnss_prior_rel: 0.003    # — · априори поправки: рост σ положения на метр пути (типичный дрейф, не запас ss_rel)
    gnss_scale_adapt: false    # — · подстройка масштаба пути по отрезкам между поправками RTK
    gnss_stop_skip_m: 0.0    # м · после поправки GNSS столько м пути без привязки к остановке
    gnss_persist_s: 10.0    # с · невязка RTK вне ворот (или поперёк пути, пара против курса) держится столько — оценка сбилась, ставим по GNSS; короче — скачок GNSS, не верим
    origin_lat: .nan    # ° · начало для projection enu; NaN — первая точка GNSS master
    origin_lon: .nan    # ° · начало для projection enu; NaN — первая точка GNSS master
    origin_alt: .nan    # м · начало для projection enu; NaN — первая точка GNSS master
    frame_id: "map"    # — · имя системы положения: плоские MGRS от угла 37UCB (см. projection, mgrs_grid)
    child_frame_id: "base_link"    # — · система вагона: ось поворота передней тележки, уровень рельса
    sheet: "auto"    # — · auto — лист пакета config/tram.yaml подкладывается под параметры запуска (ros2 run без --params-file работает по нему); путь к листу; none — заглушки Params (имитатор)
    pulse_horizon_s: 0.2    # с · пульс: входы молчат — прогноз на копии связки не дальше этого от последней метки; 0 — без пульса. Короткий: узлы прогноза вернувшиеся после паузы входы повторно не публикуют, и их выход ждёт до горизонта
    pulse_margin_s: 0.1    # с · пульс: узел просрочен на столько (ручка есть) — прогноз
    pulse_margin_nohandle_s: 0.03    # с · то же без ручки (сетку двигают только тележки)
    pulse_period_s: 0.01    # с · период таймера пульса по монотонным часам
    start_sort_s: 0.1    # с · первые столько секунд по часам прихода сообщения сортируются по метке (стартовый всплеск bag), сетка — с самой ранней

    # ---------- Механика ----------
    M_nom: 28000.0    # кг · паспорт · номинальная масса вагона, средняя загрузка
    r_nom: 0.35    # м · паспорт · радиус колеса при среднем износе
    n_axles: 2    # — · паспорт · число осей
    driven: [true, true]    # — · паспорт · моторные оси
    braked: [true, true]    # — · паспорт · оси с тормозом, участвующие в торможении
    v_max_line: 20.0    # м/с · паспорт · максимальная скорость на линии

    # ---------- Привод ----------
    F_notch: 36000.0    # Н · паспорт · тяга при полном отклонении ручки
    F_brake: 30000.0    # Н · паспорт · тормозная сила при полном отклонении
    v_base: 8.0    # м/с · паспорт · скорость начала ослабления поля
    v_ed_fade: 1.5    # м/с · паспорт · скорость затухания электродинамического тормоза
    brake_hold_frac: 1.0    # — · паспорт · доля тормозной силы, которую механический тормоз сохраняет ниже v_ed_fade: 1 — полное замещение, 0 — тормоз гаснет вместе с ЭД
    notch_tract: [0.066667, 0.133333, 0.2, 0.266667, 0.333333, 0.4, 0.466667, 0.533333, 0.6, 0.666667, 0.733333, 0.8, 0.866667, 0.933333, 1.0]    # — · паспорт · доля полной тяги на позициях тяги 1…N; число позиций = длина списка
    notch_brake: [0.066667, 0.133333, 0.2, 0.266667, 0.333333, 0.4, 0.466667, 0.533333, 0.6, 0.666667, 0.733333, 0.8, 0.866667, 0.933333, 1.0]    # — · паспорт · доля полной тормозной силы на позициях торможения 1…N; число позиций = длина списка
    acc_u: [-1.0, -0.933333, -0.866667, -0.8, -0.733333, -0.666667, -0.6, -0.533333, -0.466667, -0.4, -0.333333, -0.266667, -0.2, -0.133333, -0.066667, 0.0, 0.066667, 0.133333, 0.2, 0.266667, 0.333333, 0.4, 0.466667, 0.533333, 0.6, 0.666667, 0.733333, 0.8, 0.866667, 0.933333, 1.0]    # — · измерение · табличный привод: сетка нормированной команды u (позиция / число позиций); пусто — параметрическая модель F_notch/F_brake
    acc_v: [0.0, 1.0, 2.0, 3.0, 4.0, 6.0, 8.0, 10.0, 12.0, 14.0, 16.0]    # м/с · измерение · табличный привод: сетка скорости
    acc_table: [-1.0598, -0.2336, -0.0537, -1.0139, -0.5285, -1.0711, -1.3257, -1.4311, -1.352, -1.2959, -1.2683, -0.8944, -1.2993, -0.9866, -1.4361, -1.5232, -1.6461, -1.5917, -1.5039, -1.3327, -1.2674, -1.2406, -0.8079, -1.2733, -1.2374, -1.4491, -1.4657, -1.4795, -1.3732, -1.4112, -1.235, -1.2006, -1.1862, -0.8284, -1.2441, -1.2049, -1.3038, -1.2369, -1.3273, -1.2052, -1.2517, -1.0569, -1.1136, -1.1173, -0.7895, -1.1933, -1.1445, -1.2331, -1.1986, -1.3837, -1.2206, -1.2097, -1.1446, -1.0796, -1.052, -0.7711, -1.1165, -1.0964, -1.1402, -1.0946, -1.3382, -1.1747, -1.1172, -1.0828, -0.9973, -0.9592, -0.7308, -1.0495, -0.969, -1.067, -1.0693, -1.19, -1.2137, -1.1912, -0.9921, -0.8444, -0.8282, -0.6629, -0.9911, -0.8565, -0.3555, -0.4667, -0.4516, -0.556, -0.3383, -0.4574, -0.495, -0.6812, -0.6689, -0.8432, -0.7972, -0.8417, -0.7855, -0.8404, -0.8507, -0.7979, -0.9091, -0.78, -0.7203, -0.6345, -0.7508, -0.7059, -0.7556, -0.6692, -0.743, -0.7329, -0.7547, -0.749, -0.745, -0.6998, -0.5158, -0.6762, -0.6555, -0.6962, -0.6363, -0.679, -0.6839, -0.7093, -0.6936, -0.6853, -0.6332, -0.4284, -0.5894, -0.6074, -0.6119, -0.5767, -0.6472, -0.6683, -0.6767, -0.6629, -0.6476, -0.5033, -0.3858, -0.5103, -0.5464, -0.5489, -0.5319, -0.62, -0.622, -0.6302, -0.568, -0.5147, -0.3434, -0.3399, -0.4436, -0.4494, -0.4244, -0.473, -0.3619, -0.3789, -0.4193, -0.5117, -0.3644, -0.213, -0.2725, -0.3148, -0.2533, -0.2719, -0.2462, -0.0013, -0.2546, -0.1425, -0.39, -0.2366, 0.0, 0.0338, -0.1856, -0.0537, -0.0964, -0.0196, 0.0582, -0.0316, -0.0023, -0.0319, -0.0188, 0.1161, 0.0338, 0.0712, 0.0663, 0.0056, 0.0494, 0.1648, 0.0476, 0.051, 0.0136, 0.0307, 0.1508, 0.1577, 0.307, 0.1571, 0.1373, 0.1903, 0.2174, 0.1336, 0.1036, 0.1196, 0.1157, 0.1249, 0.3186, 0.4626, 0.3389, 0.2624, 0.3109, 0.3357, 0.1984, 0.168, 0.1446, 0.1568, 0.1645, 0.3629, 0.615, 0.4947, 0.4335, 0.4162, 0.3848, 0.3465, 0.0436, 0.199, 0.1185, 0.1865, 0.3813, 0.7412, 0.678, 0.5602, 0.5139, 0.5535, 0.4096, 0.2415, 0.2432, 0.207, 0.2111, 0.3757, 0.8293, 0.7421, 0.6043, 0.5877, 0.6041, 0.4817, 0.4401, 0.252, 0.2098, 0.2276, 0.4021, 0.8587, 0.801, 0.7531, 0.7773, 0.805, 0.5442, 0.4471, 0.3316, 0.3057, 0.2846, 0.5736, 0.9102, 0.9333, 0.8665, 0.9264, 0.8438, 0.6509, 0.4893, 0.3632, 0.3124, 0.3206, 0.7217, 0.8495, 0.9435, 0.914, 0.9599, 0.8808, 0.6716, 0.5475, 0.412, 0.3582, 0.3647, 0.8103, 0.8051, 0.8803, 0.9112, 0.9741, 0.8942, 0.7377, 0.6289, 0.4451, 0.4237, 0.4154, 0.895, 0.8729, 0.7653, 0.8965, 0.955, 0.8745, 0.7647, 0.6685, 0.5097, 0.4617, 0.4577, 0.9694, 0.9671, 0.8363, 0.8424, 0.9477, 0.8643, 0.7863, 0.6648, 0.5555, 0.4752, 0.496, 1.0179, 1.0498, 0.9534, 0.8448, 0.967, 0.8185, 0.7958, 0.7017, 0.5367, 0.6018, 0.555, 1.0214, 1.0327, 0.9682, 0.8579, 0.898, 0.8229, 0.7637, 0.7604, 0.5529, 0.5942, 0.5672, 1.0126, 1.0038, 0.9662, 0.8732, 0.8893, 0.7409, 0.7106, 0.6163, 0.5748, 0.5376, 0.5524]    # м/с² · измерение · табличный привод: ускорение на ровном пути A(u, v) по строкам acc_u, len(acc_u)·len(acc_v) значений; строка u = 0 — выбег, то есть сопротивление движению
    tau_drive: 0.3    # с · измерение · постоянная времени привода
    delay_drive: 0.2    # с · измерение · чистое запаздывание привода
    T_dead: 0.05    # — · настройка · мёртвая зона по нормированному моменту
    t_confirm: 0.15    # с · настройка · время подтверждения режима движения

    # ---------- Сопротивление ----------
    res_A: 0.0    # Н · измерение · постоянная часть сопротивления
    res_B: 0.0    # Н·с/м · измерение · линейная часть сопротивления
    res_C: 0.0    # Н·с²/м² · измерение · квадратичная часть сопротивления

    # ---------- Сцепление ----------
    mu_nominal: 0.25    # — · паспорт · коэффициент сцепления сухого рельса
    mu_min: 0.02    # — · паспорт · худшее сцепление (листопадная плёнка, лёд)
    tau_sat: 0.3    # с · настройка · темп снижения сцепления при признаках срыва
    tau_rec: 30.0    # с · настройка · темп восстановления сцепления без признаков срыва
    c_creep: 0.0    # — · измерение · податливость по крипу: ξ = c · μ
    c_creep_drag: 0.0    # — · измерение · крип ненагруженной оси от сопротивления вращению
    sigma_creep: 0.004    # — · настройка · неопределённость самого коэффициента крипа

    # ---------- Пределы корпуса ----------
    a_max_acc: 1.5    # м/с² · паспорт · предельное ускорение корпуса
    a_max_brake: 3.0    # м/с² · паспорт · предельное замедление корпуса, с рельсовым тормозом
    theta_max: 0.06    # рад · паспорт · максимальный уклон линии
    d_extra: 0.3    # м/с² · настройка · запас возмущения на отклонение массы и ветер
    a_free_decel: 0.75    # м/с² · паспорт · предельное замедление БЕЗ команды тормоза: уклон и сопротивление
    lock_ratio: 0.5    # — · настройка · показание оси ниже этой доли прогноза при торможении = блокировка (плавное торможение, в том числе рельсовым, отстаёт на проценты); выше — частичный юз: при срыве всех осей скорость ведёт модель с тормозной силой по ручке, ниже — колесо скользит за пиком сцепления, модель с μ → mu_min
    a_slip_margin: 1.0    # м/с² · настройка · запас над пределом ускорения до признания срыва

    # ---------- Срыв всех осей и шум ----------
    slip_all_on: true    # — · настройка · распознавать срыв ВСЕХ осей разом (юз или буксование обеих тележек) по одновременному скачку показаний; false — только прежние признаки
    slip_jump: 0.3    # м/с · настройка · скачок показания оси против её собственного тренда за один интервал (сверх a_slip_margin·интервал и шума) — признак срыва оси
    slip_rel: 0.2    # — · настройка · срыв всех осей — только если скачок каждой оси не меньше этой доли скорости: срыв — относительное проскальзывание, а скачки сбоя меток времени в данных (запаздывание показаний ~1 с, исчезающее разом у обеих тележек) — |a|·запаздывание, на обучающих прогонах 7–13 % скорости
    slip_pair_s: 0.5    # с · настройка · скачки всех осей одного знака в этом окне — один срыв всех осей (тележка может сорваться позже другой на столько: её скачок помнится, ровное показание после него скачком обратно не считается)
    slip_cont_k: 2.0    # σ · настройка · во время срыва всех осей показание дальше этого числа σ шума показания в сторону срыва не принимается (колесо ещё скользит, это лишь граница скорости корпуса); ближе или по другую сторону — принимается
    slip_t_max: 12.0    # с · настройка · наибольшая длительность срыва всех осей: дальше колёсам снова верят (защита от защёлки при ложном срабатывании или смене масштаба датчиков)
    slip_ok_s: 1.0    # с · настройка · срыв всех осей снимается, когда все новые показания столько времени подряд принимаются (колёса снова катятся с корпусом, в том числе после плавного отпускания без скачка); 0 — только скачок обратно, нули, шум или slip_t_max
    slip_ret_a: 0.7    # м/с² · настройка · во время срыва всех осей колесо возвращается к корпусу плавно, если его производная отходит от ρ·(ускорение модели) в сторону корпуса больше этого (ρ — показание/прогноз, сверх шума производной); когда отход снова меньше половины a_slip_margin — колесо вернулось, показания принимаются. Ошибка ускорения модели — до 0,45 м/с²; 0 — только скачком
    slip_sigma_a: 0.15    # м/с² · измерение · СКО ускорения модели при разомкнутом прогнозе (ошибка таблицы привода и уклоны; tools/slip_study.py --openloop): на время срыва всех осей σ возмущения равна этому, чтобы σ скорости росла честно
    noise_n: 12    # отсчётов · настройка · окно оценки шума показаний оси по вторым разностям (медиана, выбросы и сам скачок срыва её не сдвигают)
    noise_k: 3.0    # σ · настройка · шум сверх sigma_meas расширяет пороги скачка и производной оси на столько своих σ, а дисперсия измерения растёт до оценки шума: высокий шум — это шум, а не срыв

    # ---------- Датчики ----------
    meas_units: "km_h"    # — · паспорт · единицы показаний: rad_s, rpm, hz (об/с), pulses_s (импульсы/с, с ppr), m_s, km_h
    ppr: 200    # имп/об · паспорт · импульсов на оборот вала датчика (для pulses_s)
    meas_scale: 1.001287    # — · измерение · поправочный множитель показаний (износ бандажей, погрешность номинала); определяется по эталонной скорости
    sensor_ratio: 1.0    # — · паспорт · передаточное число от колеса к валу датчика: 1 — датчик на колесе; для m_s и km_h не применяется
    sensors_per_axle: 1    # — · паспорт · датчиков на ось: 2 — оба борта, 1 — один
    sensor_axles: [true, true]    # — · паспорт · оси с датчиками (при датчике на валу двигателя — только моторные)
    curve_ratio_max: 0.0    # — · паспорт · b/R_min: наибольшая относительная разница путей бортов на кривой; учитывается при одном датчике на ось
    sigma_meas: 0.05    # м/с · паспорт · шум измерения скорости оси, с учётом квантования энкодера и окна измерения
    stuck_n: 20    # отсчётов · настройка · неизменных отсчётов = подозрение на залипание датчика
    stuck_dv: 0.5    # м/с · настройка · залипание признаётся, только если остальные датчики за это время изменились больше этого: на постоянной скорости реальный энкодер может выдавать одинаковые отсчёты
    recover_tol: 0.5    # м/с · настройка · исключённый датчик возвращается, если расходится с остальными не больше recover_tol + recover_rel·v
    recover_rel: 0.1    # — · настройка · относительная часть допуска возврата датчика
    t_recover: 2.0    # с · настройка · сколько датчик должен согласоваться с остальными, чтобы вернуться в работу
    v_dead_ref: 2.0    # м/с · настройка · скорость остальных, выше которой нулевой датчик считается оборванным
    axle_dot_alpha: 0.2    # — · настройка · сглаживание производной скорости оси
    calib_gain: 0.01    # — · настройка · темп калибровки масштаба осей на выбеге
    calib_v_min: 2.0    # м/с · настройка · минимальная скорость калибровки масштаба
    scale_range: 0.1    # — · паспорт · допустимый разброс масштаба оси (износ бандажа)

    # ---------- Фильтр ----------
    gate_nis: 9.0    # — · настройка · порог нормированной невязки (9 = 3σ)
    sigma_rej_frac: 0.5    # — · настройка · доля предела ускорения в σ возмущения при отвержении всех измерений
    q_v: 0.8    # м/с² · настройка · шум процесса по скорости
    q_d: 0.02    # м/с²/√с · настройка · дрейф возмущения на выбеге
    q_k: 0.003    # 1/√с · настройка · дрейф масштаба привода под нагрузкой
    p0_s: 1.0    # м · настройка · начальная σ положения
    p0_v: 1.0    # м/с · настройка · начальная σ скорости
    p0_d: 0.3    # м/с² · настройка · начальная σ возмущения
    p0_k: 0.1    # — · настройка · начальная σ масштаба привода
    k_min: 0.4    # — · настройка · нижняя граница масштаба привода
    k_max: 1.6    # — · настройка · верхняя граница масштаба привода
    adapt_on: false    # — · настройка · адаптация масштабов привода k_t, k_b по окнам установившейся тяги и торможения; false — масштабы остаются начальными
    t_adapt: 3.0    # с · настройка · окно установившегося режима для адаптации масштаба привода (по реальному времени)
    sigma_k_meas: 0.05    # — · настройка · σ оконного измерения масштаба привода
    adapt_f_min: 0.3    # — · настройка · минимальная средняя нагрузка привода в окне, доля номинала
    t_sat_hold: 3.0    # с · настройка · после признака срыва отвержение измерений считается объяснённым срывом
    v_adapt_min: 2.0    # м/с · настройка · ниже этой скорости параметры не адаптируются (квантование энкодера у нуля)
    t_valid: 1.0    # с · настройка · без принятых измерений дольше — оценка недостоверна
    agree_tol: 0.3    # м/с · настройка · оси согласны, если их показания расходятся не больше этого; согласие всех осей перевешивает модель
    agree_age: 0.3    # с · настройка · показание другой оси годится для проверки согласия, если оно не старше этого

    # ---------- Стоянка ----------
    v_standstill: 0.3    # м/с · настройка · полоса неразличимости стоянки
    t_standstill: 0.3    # с · настройка · время подтверждения стоянки

    # ---------- Выходная σ ----------
    sv_gain: 1.0    # — · настройка · множитель σ скорости фильтра в публикуемой σ
    sv_floor: 0.01    # м/с · измерение · пол публикуемой σ скорости на ходу
    sv_floor_stand: 0.02    # м/с · измерение · пол публикуемой σ скорости на стоянке
    sv_age: 0.05    # с · измерение · эффективный возраст показаний: к σ скорости добавляется модуль ускорения, умноженный на sv_age
    sv_rel: 0.0    # — · измерение · относительная ошибка масштаба колёс: к σ скорости добавляется sv_rel·v
    ss_map: 2.0    # м · измерение · σ положения вдоль пути от карты и точки привязки
    ss_rel: 0.012    # — · измерение · рост σ положения на метр пути после выставки или привязки к остановке (масштаб колёс)

    # ---------- Служебное ----------
    dt: 0.05    # с · требование · шаг фильтра; в ноде задаётся частотой цикла rate_hz
